name: citycare
description: "A new Flutter project."
publish_to: 'none'

version: 0.43.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  geolocator: ^13.0.4
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  # Carte Google Maps. La clé d'API n'est jamais dans le code : voir lib/core/config/maps_config.dart.
  google_maps_flutter: ^2.9.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  speech_to_text: ^7.0.0
  shared_preferences: ^2.5.3
  # Menu de partage natif (SMS / WhatsApp / etc.). Pas d'envoi automatique.
  share_plus: ^10.1.4
  # QR généré localement à partir du code 6 caractères. Pas de scan caméra.
  qr_flutter: ^4.1.0
  # Galerie + appareil photo pour l’avatar. Pas de Firebase Storage.
  image_picker: ^1.1.2
  # Flush périodique de la file hors ligne (Android WorkManager, ≥ 15 min).
  workmanager: ^0.10.9
  # Batterie du téléphone au moment d’un fix GPS. Jamais 100 % inventé.
  battery_plus: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Photos hero de l’accueil (3 slides prévention, style photo).
    - assets/images/prevention/
